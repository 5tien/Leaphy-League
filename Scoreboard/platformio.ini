[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:goal_1_zender]
build_src_filter = +<main.cpp> -<receiver.cpp>
build_flags =
    ${env.build_flags}
    -D GOAL_ID=1

[env:goal_2_zender]
build_src_filter = +<main.cpp> -<receiver.cpp>
build_flags =
    ${env.build_flags}
    -D GOAL_ID=2

[env:bal_ontvanger]
build_src_filter = +<receiver.cpp> -<main.cpp>
