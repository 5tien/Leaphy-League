[platformio]
default_envs = auto_upload

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:controller]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ROLE_CONTROLLER

; De gewone PlatformIO-uploadknop start eerst de chipdetectie.
[env:auto_upload]
extends = env:controller
upload_protocol = custom
upload_command = $PYTHONEXE scripts/upload_auto.py

[env:receiver]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ROLE_RECEIVER

; Arduino Nano ESP32 en de Nano-compatibele Waveshare ESP32-S3-Nano.
[env:receiver_s3_nano]
board = arduino_nano_esp32
upload_protocol = esptool
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ROLE_RECEIVER
    -D ROLE_MOTORS
